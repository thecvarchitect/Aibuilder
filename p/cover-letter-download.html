<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Cover Letter - AI Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 50px auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); background-color: #ffffff; }
        .header { text-align: center; background-color: #00A651; color: #ffffff; padding: 15px; border-radius: 10px 10px 0 0; }
        .header h2 { margin: 0; font-size: 1.5rem; }
        .body { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Download Your Cover Letter</h2>
        </div>
        <div class="body">
            <p>Thank you for your payment! Your cover letter is ready.</p>
            <p><strong>Cover Letter Data:</strong></p>
            <pre id="coverLetterContent"></pre>
            <a href="#" id="downloadLink" class="btn btn-primary mt-3" style="background-color: #00A651; border-color: #00A651;">Download Cover Letter</a>
            <p class="mt-3"><a href="https://thecvarchitect.github.io/Aibuilder/index.html">Back to Home</a></p>
        </div>
    </div>
    <script>
        const coverLetterData = localStorage.getItem('coverLetterData');
        if (!coverLetterData) {
            document.getElementById('coverLetterContent').textContent = 'No cover letter data found. Please generate a new cover letter.';
            document.getElementById('downloadLink').style.display = 'none';
        } else {
            document.getElementById('coverLetterContent').textContent = coverLetterData;
            const blob = new Blob([coverLetterData], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = 'cover-letter.txt';
        }
    </script>
</body>
</html>
