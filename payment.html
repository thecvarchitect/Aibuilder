<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - AI Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; font-family: Arial, sans-serif; }
        .payment-form { max-width: 600px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); background-color: #ffffff; }
        .form-header { margin-bottom: 30px; text-align: center; background-color: #00A651; color: #ffffff; padding: 15px; border-radius: 10px 10px 0 0; }
        .form-header h2 { margin: 0; font-size: 1.5rem; }
        .form-body { padding: 20px; }
        .form-footer { margin-top: 20px; text-align: center; }
        .btn-primary { background-color: #00A651; border-color: #00A651; }
        .btn-primary:hover { background-color: #008c44; border-color: #008c44; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="payment-form">
            <div class="form-header">
                <h2>Lipa na M-PESA</h2>
            </div>
            <div class="form-body">
                <p class="text-center text-muted mb-4">Pay Ksh 36 to download your cover letter</p>
                <div class="d-grid gap-2">
                    <a href="https://short.payhero.co.ke/s/8a4CrCW8yaSWo62r48uHWx" class="btn btn-primary btn-lg position-relative" id="payNowBtn">
                        <i class="bi bi-credit-card-fill me-2"></i>
                        Pay Now Ksh 36
                    </a>
                </div>
            </div>
            <div class="form-footer">
                <p class="text-muted small">Powered by <a href="https://payherokenya.com" target="_blank">Pay Hero Kenya</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.js"></script>
    <script>
        const paymentConfig = {
            successURL: 'https://thecvarchitect.github.io/Aibuilder/p/cover-letter-download.html',
            failedURL: 'https://thecvarchitect.github.io/Aibuilder/index.html'
        };

        const coverLetterData = localStorage.getItem('coverLetterData');
        if (!coverLetterData) {
            Swal.fire({
                title: 'No Cover Letter Found',
                text: 'Please generate a cover letter before proceeding to payment.',
                icon: 'warning',
                confirmButtonText: 'Go Back'
            }).then(() => {
                window.location.href = paymentConfig.failedURL;
            });
        }
    </script>
</body>
</html>
